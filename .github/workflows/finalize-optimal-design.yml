name: Finalize optimal-design branch

on:
  push:
    branches: [agent/optimal-experimental-design]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[optimal-design finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/optimal-experimental-design
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Add rank-restoring initialization and normalize formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bayesian_ach/optimal_design.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def greedy_maximin_schedule(')
          end = text.index('\ndef evaluate_schedule(', start)
          replacement = '''def greedy_maximin_schedule(
              conditions: Sequence[TrialCondition],
              n_trials: int,
              config: DesignConfig,
              *,
              max_repeats_per_condition: int | None = None,
          ) -> tuple[TrialCondition, ...]:
              """Construct a rank-restoring schedule, then maximize worst-pair separation.

              A symmetric-KL objective is degenerate for the first few trials because an
              intercept and nuisance regressor can span the available observations. The
              initialization therefore chooses unique conditions by a deterministic
              D-optimal rank/log-determinant criterion. Once the candidate library has
              been covered, additional repetitions maximize robust worst-pair separation.
              """

              if not conditions:
                  raise ValueError("conditions must not be empty")
              if n_trials < 1:
                  raise ValueError("n_trials must be positive")
              maximum = (
                  n_trials
                  if max_repeats_per_condition is None
                  else max_repeats_per_condition
              )
              if maximum < 1:
                  raise ValueError("max_repeats_per_condition must be positive")

              reference = tuple(conditions)
              _, signal_matrix = candidate_signal_matrix(reference)
              nuisance = np.asarray(
                  [condition.nuisance_level for condition in reference], dtype=float
              )
              selected_indices: list[int] = []
              remaining = set(range(len(reference)))
              unique_target = min(n_trials, len(reference))
              ridge = 1e-6 * np.eye(signal_matrix.shape[1])
              while len(selected_indices) < unique_target:
                  candidates: list[tuple[int, float, float, str, int]] = []
                  for index in remaining:
                      indices = [*selected_indices, index]
                      matrix = signal_matrix[indices]
                      rank = int(np.linalg.matrix_rank(matrix))
                      sign, logdet = np.linalg.slogdet(matrix.T @ matrix + ridge)
                      if sign <= 0:
                          logdet = -np.inf
                      imbalance = abs(float(np.sum(nuisance[indices])))
                      candidates.append(
                          (rank, float(logdet), -imbalance, reference[index].name, index)
                      )
                  winner = sorted(
                      candidates,
                      key=lambda item: (-item[0], -item[1], -item[2], item[3]),
                  )[0][-1]
                  selected_indices.append(winner)
                  remaining.remove(winner)

              selected = [reference[index] for index in selected_indices]
              counts = {condition.name: 0 for condition in reference}
              for condition in selected:
                  counts[condition.name] += 1
              if any(value > maximum for value in counts.values()):
                  raise ValueError(
                      "repeat constraint is incompatible with rank-restoring initialization"
                  )

              while len(selected) < n_trials:
                  candidates = []
                  for condition in reference:
                      if counts[condition.name] >= maximum:
                          continue
                      proposed = (*selected, condition)
                      score = min_pairwise_symmetric_kl(
                          proposed,
                          config,
                          reference_conditions=reference,
                          robust=True,
                      )
                      candidates.append((score, condition.name, condition))
                  if not candidates:
                      raise ValueError(
                          "repeat constraint makes the requested schedule impossible"
                      )
                  _, _, winner = sorted(
                      candidates, key=lambda item: (-item[0], item[1])
                  )[0]
                  selected.append(winner)
                  counts[winner.name] += 1
              return tuple(selected)
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          ruff check --fix \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_design_cli.py
      - name: Validate focused scientific change
        run: |
          ruff check \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_design_cli.py
          mypy \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py
          pytest -q tests/test_optimal_design.py tests/test_design_cli.py
          python -m bayesian_ach.design_benchmark \
            --output /tmp/bayesian-ach-optimal-design \
            --quick \
            --seed 7
      - name: Commit clean finalized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/finalize-optimal-design.yml
          git add -- \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_design_cli.py
          git commit \
            -m 'Finalize rank-restoring optimal-design schedule' \
            -m 'Use deterministic D-optimal initialization before robust maximin replication; validate static checks, focused tests, and the evidence CLI. [optimal-design finalized]'
          git push origin HEAD:agent/optimal-experimental-design

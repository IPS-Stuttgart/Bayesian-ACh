name: Finalize optimal-design branch

on:
  push:
    branches: [agent/optimal-experimental-design]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[optimal-design-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/optimal-experimental-design
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Normalize imports
        run: ruff check --fix src/bayesian_ach/smoothing.py
      - name: Validate branch
        run: |
          ruff check .
          mypy src/bayesian_ach
          pytest --cov=bayesian_ach --cov-report=term-missing
          bayesian-ach replay-benchmark --output /tmp/replay --sequences 16 --sequence-length 28 --replay-samples 32 --seed 11
          bayesian-ach design-benchmark --output /tmp/design --budget 24 --replicates 12 --seed 11
          python -m build
      - name: Commit normalized scientific branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-optimal-design.yml
          git add -- src/bayesian_ach/smoothing.py
          git commit -m "Finalize optimal-design quality gates [optimal-design-finalized]"
          git push origin HEAD:agent/optimal-experimental-design

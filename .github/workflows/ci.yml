name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src/bayesian_ach
      - run: python scripts/check_markdown_math.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=bayesian_ach --cov-report=term-missing
      - run: bayesian-ach dissociate --output /tmp/bayesian-ach-smoke --pairs 32 --seed 11
      - run: >-
          bayesian-ach regime-benchmark
          --output /tmp/bayesian-ach-regime-smoke
          --sequences-per-class 4
          --pre-length 16
          --post-length 24
          --seed 11
      - run: >-
          bayesian-ach observation-benchmark
          --output /tmp/bayesian-ach-observation-smoke
          --sequences-per-class 3
          --pre-length 8
          --post-length 12
          --seed 11
      - run: >-
          bayesian-ach measurement-benchmark
          --output /tmp/bayesian-ach-measurement-smoke
          --subjects 3
          --sessions-per-subject 3
          --train-sessions-per-subject 2
          --calibration-length 40
          --task-length 80
          --seed 11
      - run: >-
          bayesian-ach closed-loop-benchmark
          --output /tmp/bayesian-ach-closed-loop-smoke
          --subjects 5
          --sessions-per-subject 4
          --train-sessions-per-subject 2
          --opportunities-per-session 72
          --seed 11
      - run: >-
          bayesian-ach replay-benchmark
          --output /tmp/bayesian-ach-replay-smoke
          --sequences 16
          --sequence-length 28
          --replay-samples 32
          --seed 11
      - run: >-
          bayesian-ach-design
          --output /tmp/bayesian-ach-design-smoke
          --budget 24
          --replicates 12
          --seed 11

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build

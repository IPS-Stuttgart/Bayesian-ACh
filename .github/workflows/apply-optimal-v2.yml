name: Apply Bayesian-ACh Bayesian optimal-design v0.8 overlay

on:
  push:
    branches: [agent/optimal-experimental-design]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[optimal-v2 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/optimal-experimental-design
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Reconstruct and verify the prepared overlay
        run: |
          cat .bootstrap_optimal_v2/chunks/part-* | base64 -d > /tmp/optimal-v2.tar.gz
          echo "9eacb1f4dde350e98daef7c6673c98969c8216219f177c5786804fc69421be44  /tmp/optimal-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/optimal-v2.tar.gz -C .
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate complete repository and all design interfaces
        run: |
          ruff check .
          mypy src/bayesian_ach
          pytest --cov=bayesian_ach --cov-report=term-missing
          python -m build
          bayesian-ach-design \
            --output /tmp/bayesian-ach-finite-design \
            --budget 24 \
            --replicates 12 \
            --seed 11
          bayesian-ach replay-benchmark \
            --output /tmp/bayesian-ach-replay \
            --sequences 16 \
            --sequence-length 28 \
            --replay-samples 32 \
            --seed 11
          bayesian-ach-optimal-design \
            --output /tmp/bayesian-ach-optimal-design \
            --quick \
            --seed 11
      - name: Commit the scientific files without workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/ci.yml
          git rm -r -- .bootstrap_optimal_v2
          git add -- \
            CHANGELOG.md \
            CITATION.cff \
            docs/bayesian_optimal_design.md \
            pyproject.toml \
            src/bayesian_ach/cli_ext.py \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/optimal_design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_optimal_design_cli.py
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo "A workflow change was accidentally staged" >&2
            exit 1
          fi
          git commit \
            -m "Add measurement-aware Bayesian optimal design" \
            -m "Preserve the finite-grid v0.7 optimizer while adding nuisance-residualized, sensor-aware prior-predictive design, robust maximin scheduling, recovery and subject-count atlases, version 0.8 metadata, and tests. [optimal-v2 applied]"
          git push origin HEAD:agent/optimal-experimental-design

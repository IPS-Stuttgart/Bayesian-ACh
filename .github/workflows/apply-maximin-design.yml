name: Apply Bayesian-ACh maximin design milestone

on:
  push:
    branches: [agent/maximin-experiment-design]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[maximin applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/maximin-experiment-design
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Reconstruct and verify scientific overlay
        run: |
          cat .bootstrap_design/chunks/part-* | base64 -d > /tmp/bayesian-ach-maximin-design.tar.gz
          echo "bad8aca54294bf4a6d2457ace4a35cc7c1340c44624df5b64d1e41dc59d29e64  /tmp/bayesian-ach-maximin-design.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bayesian-ach-maximin-design.tar.gz -C .bootstrap_design
      - name: Apply maximin experiment-design milestone
        run: |
          python .bootstrap_design/apply_design.py --repo .
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_ach/design_benchmark.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "for repetition in range(config.recovery_repetitions):",
              "for _repetition in range(config.recovery_repetitions):",
          )
          text = text.replace(
              "def run_design_benchmark(\n"
              "    config: DesignBenchmarkConfig = DesignBenchmarkConfig(),\n"
              ") -> DesignBenchmarkResult:\n"
              "    \"\"\"Optimize a schedule and verify downstream candidate-code recovery.\"\"\"\n\n"
              "    config.validate()",
              "def run_design_benchmark(\n"
              "    config: DesignBenchmarkConfig | None = None,\n"
              ") -> DesignBenchmarkResult:\n"
              "    \"\"\"Optimize a schedule and verify downstream candidate-code recovery.\"\"\"\n\n"
              "    if config is None:\n"
              "        config = DesignBenchmarkConfig()\n"
              "    config.validate()",
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm -rf .bootstrap_design
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate complete repository
        run: |
          ruff check --fix \
            src/bayesian_ach/__init__.py \
            src/bayesian_ach/cli.py \
            src/bayesian_ach/design.py \
            src/bayesian_ach/design_benchmark.py \
            src/bayesian_ach/smoothing.py \
            tests/test_design.py \
            tests/test_design_benchmark.py \
            tests/test_design_cli.py \
            tests/test_replay_cli.py
          ruff check .
          mypy src/bayesian_ach
          pytest --cov=bayesian_ach --cov-report=term-missing
          python -m build
          bayesian-ach design-benchmark \
            --output /tmp/bayesian-ach-design-smoke \
            --trials 128 \
            --repetitions 24 \
            --seed 11
      - name: Commit clean scientific change set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .bootstrap_design
          git rm -- .github/workflows/apply-maximin-design.yml
          git rm --ignore-unmatch .github/workflows/apply-v0-6.yml
          git add -- \
            .github/workflows/ci.yml \
            CHANGELOG.md \
            CITATION.cff \
            README.md \
            docs/optimal_design.md \
            docs/roadmap.md \
            examples/plot_design_benchmark.py \
            pyproject.toml \
            results/README.md \
            src/bayesian_ach/__init__.py \
            src/bayesian_ach/cli.py \
            src/bayesian_ach/design.py \
            src/bayesian_ach/design_benchmark.py \
            src/bayesian_ach/smoothing.py \
            tests/test_design.py \
            tests/test_design_benchmark.py \
            tests/test_design_cli.py \
            tests/test_replay_cli.py
          if git diff --cached --name-only | grep -E '^\.bootstrap_design|apply-maximin-design\.yml$'; then
            echo "Bootstrap artifact remains staged" >&2
            exit 1
          fi
          git commit \
            -m "Add prospective maximin ACh experiment design" \
            -m "Optimize finite trial schedules for worst-pair computational identifiability, add prospective recovery and trial-efficiency evidence, integrate replay and design commands, remove obsolete applicators, and publish version 0.7.0. [maximin applied]"
          git push origin "HEAD:agent/maximin-experiment-design"

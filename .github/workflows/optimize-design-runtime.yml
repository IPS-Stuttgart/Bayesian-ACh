name: Optimize design benchmark runtime

on:
  push:
    branches: [agent/optimal-experimental-design]

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[design runtime optimized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/optimal-experimental-design
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Reuse precomputed predictive distributions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bayesian_ach/design_benchmark.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = '    HYPOTHESIS_NAMES,\n'
          if '    _gaussian_logpdf,\n' not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + '    _gaussian_logpdf,\n',
                  1,
              )
          old = '''                total_log_score += hypothesis_log_likelihoods(
                    observed,
                    schedule,
                    design_config,
                    reference_conditions=reference_conditions,
                )
          '''
          new = '''                total_log_score += np.asarray(
                    [
                        _gaussian_logpdf(observed[None, :], candidate)[0]
                        for candidate in distributions
                    ],
                    dtype=float,
                )
          '''
          if old not in text:
              raise SystemExit('group-scoring block not found')
          text = text.replace(old, new, 1)
          text = text.replace('    hypothesis_log_likelihoods,\n', '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate optimized implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check --fix \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_design_cli.py
          ruff check \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_design_cli.py
          mypy \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py
          pytest -q tests/test_optimal_design.py tests/test_design_cli.py
          python -m bayesian_ach.design_benchmark \
            --output /tmp/bayesian-ach-optimal-design \
            --quick \
            --seed 7
      - name: Commit clean runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/optimize-design-runtime.yml
          git add -- \
            src/bayesian_ach/optimal_design.py \
            src/bayesian_ach/design_benchmark.py \
            tests/test_optimal_design.py \
            tests/test_design_cli.py
          git commit \
            -m 'Reuse predictive distributions in group design recovery' \
            -m 'Avoid repeated covariance construction and Cholesky factorization for every simulated subject. [design runtime optimized]'
          git push origin HEAD:agent/optimal-experimental-design

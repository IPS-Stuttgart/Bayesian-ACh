name: Apply Bayesian-ACh v0.5 overlay

on:
  push:
    branches:
      - agent/closed-loop-eligibility-v0.5
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.5 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/closed-loop-eligibility-v0.5
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Reconstruct and verify overlay
        run: |
          cat .bootstrap_v0_5/chunks/part-* | base64 -d > /tmp/bayesian-ach-v0.5.tar.gz
          echo "bd0a6f54b92fe398f5241b2185358b40fc808068a559dc4f0a2e2607b7d26eda  /tmp/bayesian-ach-v0.5.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bayesian-ach-v0.5.tar.gz -C .bootstrap_v0_5
      - name: Apply verified overlay
        run: python .bootstrap_v0_5/apply_v0_5.py --repo . --force
      - name: Normalize posterior NumPy dtypes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bayesian_ach/closed_loop.py")
          text = path.read_text(encoding="utf-8")
          old = """    covariance = np.linalg.inv(precision)\n    mean = covariance @ (design.T @ outcome / noise_variance)\n    return mean, covariance\n"""
          new = """    covariance = np.asarray(np.linalg.inv(precision), dtype=np.float64)\n    mean = np.asarray(\n        covariance @ (design.T @ outcome / noise_variance),\n        dtype=np.float64,\n    )\n    return mean, covariance\n"""
          if old not in text:
              raise SystemExit("expected closed-loop posterior block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate milestone
        run: |
          ruff check src/bayesian_ach/closed_loop_benchmark.py .bootstrap_v0_5/files/src/bayesian_ach/closed_loop_benchmark.py --fix
          ruff check .
          mypy src/bayesian_ach
          pytest --cov=bayesian_ach --cov-report=term-missing
          python -m build
      - name: Commit scientific milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .bootstrap_v0_5
          git add -- \
            CHANGELOG.md \
            CITATION.cff \
            README.md \
            docs/closed_loop.md \
            docs/roadmap.md \
            examples/plot_closed_loop_recovery.py \
            pyproject.toml \
            results/README.md \
            src/bayesian_ach/__init__.py \
            src/bayesian_ach/cli.py \
            src/bayesian_ach/closed_loop.py \
            src/bayesian_ach/closed_loop_benchmark.py \
            tests/test_closed_loop.py \
            tests/test_closed_loop_cli.py
          git add -u -- .bootstrap_v0_5
          git commit \
            -m "Add delayed closed-loop eligibility recovery" \
            -m "Introduce causal triggering, calibrated transport delay, yoked active/sham controls, held-out eligibility-family recovery, version 0.5 documentation, tests, and CI evidence. [v0.5 applied]"
          git push origin "HEAD:agent/closed-loop-eligibility-v0.5"

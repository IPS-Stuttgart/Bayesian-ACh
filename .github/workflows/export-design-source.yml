name: Export optimal-design source

on:
  push:
    branches: [agent/optimal-experimental-design]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git archive --format=tar.gz --output=bayesian-ach-current.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: bayesian-ach-current-source
          path: bayesian-ach-current.tar.gz
          if-no-files-found: error
          retention-days: 1
